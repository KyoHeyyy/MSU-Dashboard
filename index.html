<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSU Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MapleStory Universe</p>
          <h1>Game Dashboard</h1>
          <!-- <p class="subcopy">個人用ダッシュボード。</p> -->
        </div>
      </header>

      <section class="summary-grid" aria-label="Summary">
        <!-- <article class="summary-card">
          <span class="summary-label">Daily Completion</span>
          <strong>67%</strong>
        </article> -->
        <article class="summary-card">
          <span class="summary-label">Boss Progress</span>
          <div id="boss-progress" class="card-list">
            <strong>取得中</strong>
          </div>
        </article>
        <!-- <article class="summary-card">
          <span class="summary-label">Weekly Boss</span>
          <strong>3 Characters</strong>
        </article> -->
      </section>

      <nav class="view-tabs" aria-label="Timeframe tabs">
        <button class="tab-button active" id="tab-daily" type="button" data-view="daily" aria-selected="true">
          DAILY
        </button>
        <button class="tab-button" id="tab-weekly" type="button" data-view="weekly" aria-selected="false">
          WEEKLY
        </button>
        <button class="tab-button" id="tab-event" type="button" data-view="event" aria-selected="false">
          EVENT
        </button>
        <button class="tab-button" id="tab-reward" type="button" data-view="reward" aria-selected="false">
          REWARD
        </button>
      </nav>

      <!-- <section class="debug-panel" aria-label="Debug response">
        <div class="debug-panel-header">
          <h2>Debug JSON</h2>
          <span class="panel-tag">Temporary</span>
        </div>
        <pre id="debug-json">Waiting for API response...</pre>
      </section> -->

      <main class="dashboard-view">
        <section id="daily-view" class="dashboard-grid view-panel active" data-view="daily">
          <section class="board-panel panel-daily">
            <div class="panel-header">
              <h2>Daily Task</h2>
              <div class="panel-actions">
                <button id="daily-reset-button" class="icon-button" type="button" aria-label="Dailyをリセット" title="Dailyをリセット" hidden>↺</button>
                <button id="daily-reset-mode-button" class="secondary-button" type="button" aria-label="リセットモードを切り替え" title="リセットモードを切り替え" hidden>Auto</button>
                <button id="daily-config-button" class="icon-button" type="button" aria-label="Daily設定を開く" title="Daily設定を開く">&#9881;</button>
              </div>
            </div>
            <div id="daily-board" class="card-list"></div>
          </section>
        </section>

        <section id="weekly-view" class="dashboard-grid view-panel" data-view="weekly">
          <section class="board-panel panel-weekly-task">
            <div class="panel-header">
              <h2>Weekly Task</h2>
              <div class="panel-actions">
                <button id="weekly-reset-button" class="icon-button" type="button" aria-label="Weekly Taskをリセット" title="Weekly Taskをリセット" hidden>↺</button>
                <button id="weekly-reset-mode-button" class="secondary-button" type="button" aria-label="Weekly Taskリセットモードを切り替え" title="Weekly Taskリセットモードを切り替え" hidden>Auto</button>
                <button id="weekly-task-config-button" class="icon-button" type="button" aria-label="Weekly Task設定を開く" title="Weekly Task設定を開く">&#9881;</button>
              </div>
            </div>
            <div id="weekly-task-board" class="card-list"></div>
          </section>

          <section class="board-panel panel-weekly">
            <div class="panel-header">
              <h2>Weekly Boss</h2>
              <div class="panel-actions">
                <div id="weekly-boss-markers" class="weekly-boss-markers" aria-label="Weekly Bossマーカー"></div>
                <button id="weekly-config-button" class="icon-button" type="button" aria-label="Weekly Boss設定を開く" title="Weekly Boss設定を開く">&#9881;</button>
              </div>
            </div>
            <div id="weekly-board" class="card-list"></div>
          </section>
        </section>

        <section id="event-view" class="dashboard-grid view-panel" data-view="event">
          <section class="board-panel panel-event">
            <div class="panel-header">
              <div>
                <h2>Schedule</h2>
              </div>
            </div>
            <div id="event-board" class="card-list"></div>
          </section>
        </section>

        <section id="reward-view" class="dashboard-grid view-panel" data-view="reward">
          <section class="board-panel panel-reward">
            <div class="panel-header">
              <div>
                <h2>Weekly Rewards</h2>
                <div class="reward-totals">
                  <p class="reward-total">NESO total <strong id="neso-total">0</strong></p>
                  <p class="reward-total">PowerCrystal total <strong id="powercrystal-total">0</strong></p>
                </div>
              </div>
              <div class="reward-week-buttons" role="group" aria-label="報酬の週を選択">
                <button class="reward-week-button active" type="button" data-reward-week="1" aria-pressed="true">1週前</button>
                <button class="reward-week-button" type="button" data-reward-week="2" aria-pressed="false">2週前</button>
                <button class="reward-week-button" type="button" data-reward-week="3" aria-pressed="false">3週前</button>
              </div>
            </div>
            <div id="reward-board" class="card-list"></div>
          </section>
          <section class="debug-panel reward-debug-panel" aria-label="Reward API response debug">
            <div class="debug-panel-header">
              <h2>Reward API response</h2>
              <span class="panel-tag">DEBUG</span>
            </div>
            <div id="reward-debug-board" class="card-list">
              <p class="debug-empty">取得中</p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="weekly-marker-dialog" class="weekly-marker-dialog" aria-labelledby="weekly-marker-dialog-title">
      <form id="weekly-marker-form" method="dialog">
        <div class="weekly-marker-dialog-header">
          <div>
            <p class="eyebrow">Weekly Boss</p>
            <h2 id="weekly-marker-dialog-title">マーカー名を変更</h2>
          </div>
          <button id="weekly-marker-dialog-close" class="icon-button" type="button" aria-label="閉じる" title="閉じる">&#10005;</button>
        </div>
        <label class="weekly-marker-name-label" for="weekly-marker-name">マーカー名</label>
        <input id="weekly-marker-name" class="weekly-marker-name-input" type="text" maxlength="30" autocomplete="off" required />
        <div class="weekly-marker-dialog-actions">
          <button id="weekly-marker-cancel" class="secondary-button" type="button">キャンセル</button>
          <button class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="/data/events.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/eventPage.js"></script>
  </body>
</html>
