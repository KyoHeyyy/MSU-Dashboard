<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSU Dashboard - Events</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        margin: 0;
        background: #07111d;
        color: #e2e8f0;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .event-page-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .event-page-header {
        margin-bottom: 20px;
      }

      .event-page-header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      .event-page-header p {
        margin: 0;
        color: #94a3b8;
      }

      .event-panel {
        background: rgba(16, 25, 45, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 18px;
        padding: 18px;
      }
    </style>
  </head>
  <body>
    <main class="event-page-shell">
      <header class="event-page-header">
        <h1>Events</h1>
      </header>

      <section class="event-panel">
        <div id="event-board" class="card-list"></div>
      </section>
    </main>

    <script src="/data/events.js"></script>
    <script type="module" src="/src/eventPage.js"></script>
  </body>
</html>
